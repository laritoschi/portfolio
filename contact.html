<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-key="page.title.contact">Contact | Lari S.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="index.html">Lari</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html" data-i18n-key="nav.home">Início</a>
          <a href="case-studies.html" data-i18n-key="nav.case-studies">Casos de estudo</a>
          <a href="about.html" data-i18n-key="nav.about">Sobre (CV)</a>
          <a href="contact.html" class="active" data-i18n-key="nav.contact">Contato</a>
          <div class="lang-switcher" aria-label="Language switcher">
            <button class="lang-btn" data-lang="pt" aria-label="Português">PT</button>
            <button class="lang-btn" data-lang="en" aria-label="English">EN</button>
          </div>
        </nav>
      </header>

      <main class="contact-page">
        <section class="contact-card">
          <div>
            <p class="section-label" data-i18n-key="contact.page.label">Contact</p>
            <h1 data-i18n-key="contact.title">Let’s build something clear, useful, and memorable.</h1>
            <p data-i18n-key="contact.text">Whether it’s a product strategy conversation, a design leadership discussion, or a collaboration opportunity, I’d love to hear from you.</p>
          </div>

          <form class="contact-form">
            <label>
              <span data-i18n-key="contact.form.name">Name</span>
              <input type="text" placeholder="Your name" data-i18n-placeholder="contact.form.placeholder.name" />
            </label>
            <label>
              <span data-i18n-key="contact.form.email">Email</span>
              <input type="email" placeholder="you@example.com" data-i18n-placeholder="contact.form.placeholder.email" />
            </label>
            <label>
              <span data-i18n-key="contact.form.message">Message</span>
              <textarea rows="5" placeholder="Tell me about the product, challenge, or opportunity." data-i18n-placeholder="contact.form.placeholder.message"></textarea>
            </label>
            <button class="button primary" type="submit" data-i18n-key="contact.form.submit">Send message</button>
          </form>
        </section>

        <section class="social-links">
          <a href="mailto:lari@example.com" data-i18n-key="contact.social.email">Email</a>
          <a href="https://www.linkedin.com" target="_blank" rel="noreferrer" data-i18n-key="contact.social.linkedin">LinkedIn</a>
          <a href="tel:+5511999999999" data-i18n-key="contact.social.phone">Phone</a>
        </section>
      </main>
    </div>
    <script src="lang.js"></script>
  </body>
</html>
